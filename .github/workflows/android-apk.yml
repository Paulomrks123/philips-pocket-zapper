name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "vite.config.*"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build versioned APK
        run: gradle -p android -PversionCode=${{ github.run_number }} assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: philips-pocket-zapper-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check whether this is the latest main commit
        id: latest
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish APK release
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Philips Pocket Zapper v${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
